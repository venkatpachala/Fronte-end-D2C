<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Newsreader";
      font-style: normal;
      font-weight: 400 700;
      src: url("./fonts/cY9AfjOCX1hbuyalUrK4397yjA.woff2") format("woff2");
    }
    @font-face {
      font-family: "Newsreader";
      font-style: italic;
      font-weight: 400 700;
      src: url("./fonts/cY9CfjOCX1hbuyalUrK439vCjohC.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 500;
      src: url("./fonts/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2") format("woff2");
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #090A0B;
      color: #F3F0E8;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(44, 49, 54, 0.85) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(44, 49, 54, 0.85) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 8%, transparent 70%);
      mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 8%, transparent 70%);
    }
    .stage {
      position: relative;
      z-index: 1;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 64px 88px 96px;
    }
    .lockup {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .mark {
      width: 132px;
      height: 132px;
      flex: none;
    }
    .mark svg { display: block; width: 132px; height: 132px; }
    h1 {
      margin: 0;
      font-family: "Newsreader", "Liberation Serif", serif;
      font-weight: 500;
      font-size: 168px;
      line-height: 0.84;
      letter-spacing: -0.04em;
      font-optical-sizing: auto;
    }
    .rule {
      width: 184px;
      height: 2px;
      margin: 30px 0 0;
      background: #DFF25A;
    }
    .line {
      margin: 28px 0 0;
      max-width: 920px;
      text-align: center;
      font-family: "Newsreader", "Liberation Serif", serif;
      font-style: italic;
      font-weight: 450;
      font-size: 36px;
      line-height: 1.3;
      letter-spacing: -0.011em;
    }
    footer {
      position: absolute;
      left: 52px;
      right: 52px;
      bottom: 36px;
      display: flex;
      justify-content: space-between;
      font-family: "IBM Plex Mono", "Liberation Mono", monospace;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9C978C;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="stage">
    <div class="lockup">
      <div class="mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <rect width="32" height="32" rx="7" fill="#DFF25A"/>
          <path fill="#14160A" d="M16.00,6.40 7.60,25.40 11.04,25.40 16.00,14.19 20.96,25.40 24.40,25.40Z"/>
          <path fill="#14160A" d="M13.42,19.00 18.58,19.00 19.92,22.05 12.08,22.05Z"/>
        </svg>
      </div>
      <h1>Archal</h1>
    </div>
    <div class="rule"></div>
    <p class="line">The desk that resolves.<br>The hold that protects the refund.</p>
  </div>
  <footer>
    <span>D2C operations</span>
    <span>Policy · Hold · Close</span>
  </footer>
</body>
</html>
